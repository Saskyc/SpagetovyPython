# Svět: Zničená říše Aldoria
# Pohyb: up=y+1, down=y-1, right=x+1, left=x-1
# block: true = daný směr je ZABLOKOVÁN (zeď, propast, atd.)

- id: 1
  jmeno: "Vesnice Prahu"
  popis: "Malá vesnice na okraji Temného lesa. Vyhořelé domy svědčí o nedávném nájezdu goblinů. U studny leží zrezivělý meč."
  x: 0
  y: 0
  block:
    up: false    # -> Temný les (0,1)
    right: false # -> Tržiště (1,0)
    down: true   # zeď
    left: true   # zeď
  enemies:
    - name: "Goblin"
      health: 30
      attack: 8
      defense: 2
      loot_item: "Malý lektvar"
  spawn_chance: 0.4

- id: 2
  jmeno: "Tržiště"
  popis: "Opuštěné tržiště. Rozházené zboží a převrácené stánky. V jednom stánku najdeš použitelný štít."
  x: 1
  y: 0
  block:
    up: false    # -> Křižovatka (1,1)
    right: false # -> Stará kovárna (2,0)
    down: true
    left: false  # -> Vesnice Prahu (0,0)
  enemies: []
  spawn_chance: 0.0

- id: 3
  jmeno: "Stará kovárna"
  popis: "Kovárna trpaslíků, dávno opuštěná. Žár v peci ještě doutná. Na kovadlině leží tajemný meč s runami."
  x: 2
  y: 0
  block:
    up: false    # -> Okraj propasti (2,1)
    right: true  # propast
    down: true
    left: false  # -> Tržiště (1,0)
