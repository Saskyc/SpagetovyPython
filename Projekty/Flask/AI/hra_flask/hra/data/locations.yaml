      health: 50
      attack: 15
      defense: 5
      loot_item: "Runový meč"
  spawn_chance: 0.7

- id: 4
  jmeno: "Temný les"
  popis: "Hustý les opředený temnou magií. Stromy jsou zkroucené, vzduch páchne sírou. Slyšíš vlčí vytí."
  x: 0
  y: 1
  block:
    up: false    # -> Háj duchů (0,2)
    right: false # -> Křižovatka (1,1)
    down: false  # -> Vesnice Prahu (0,0)
    left: false # -> Jeskynní Otvor (-1, 1)
