- id: 5
  jmeno: "Křižovatka osudu"
  popis: "Čtyřcestná křižovatka označená starým kamenem. Nápis praví: 'Jen ten kdo nese Pečeť krále, projde branou věčnosti.' Cesta na sever vede k hradu."
  x: 1
  y: 1
  block:
    up: false    # -> Hrad Aldoria (1,2)
    right: false # -> Okraj propasti (2,1)
    down: false  # -> Tržiště (1,0)
    left: false  # -> Temný les (0,1)
  enemies: []
  spawn_chance: 0.0

- id: 6
  jmeno: "Okraj propasti"
  popis: "Úzká stezka podél obrovské propasti. Dole se valí mlha. Na útesové římsě visí koža starého hrdiny s přilbou."
